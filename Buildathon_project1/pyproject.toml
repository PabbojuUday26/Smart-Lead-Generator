[project]
name = "email-writer-crewai"
version = "0.1.0"
description = "CrewAI project that writes emails using LLM"
requires-python = ">=3.10,<3.12"

dependencies = [
    "accelerate>=1.12.0",
    "crewai",
    "google-generativeai>=0.8.6",
    "langchain",
    "langchain-google-genai>=4.2.0",
    "litellm>=1.75.3",
    "openai",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "python-dotenv",
    "torch>=2.9.1",
    "transformers>=4.46.3",
]
